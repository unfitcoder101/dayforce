# Served by the frontend image (nginx-unprivileged, port 8080).
# /api/ goes to the backend Service with the path unchanged, so the browser only ever talks to
# one origin and no CORS is needed. Everything else is the single-page app.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
