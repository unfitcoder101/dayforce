apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is created by infra/k8s/scripts/create-secret.sh, not by this file.
namespace: main

resources:
  - ../../base

# Images built and pushed by .github/workflows/cd.yml. Tags are "latest" and "sha-<commit>".
# Before a real deploy pin both to the same commit (see infra/k8s/README.md):
#   kustomize edit set image dayforce-backend=ghcr.io/unfitcoder101/dayforce-backend:sha-<commit>
#   kustomize edit set image dayforce-frontend=ghcr.io/unfitcoder101/dayforce-frontend:sha-<commit>
images:
  - name: dayforce-backend
    newName: ghcr.io/unfitcoder101/dayforce-backend
    newTag: latest
  - name: dayforce-frontend
    newName: ghcr.io/unfitcoder101/dayforce-frontend
    newTag: latest
